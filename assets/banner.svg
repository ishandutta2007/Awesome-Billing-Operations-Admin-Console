<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Style for Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-18px) scale(1.05); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(16px) scale(0.96); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.15); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      .glow-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite 2s;
        transform-origin: 1000px 300px;
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .chart-stream {
        stroke-dasharray: 8 6;
        animation: dashMove 3s linear infinite;
      }
      .dynamic-wave {
        animation: waveSlide 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glowing Orbs (in background) -->
  <circle class="glow-orb-1" cx="200" cy="90" r="180" fill="url(#glow1)" />
  <circle class="glow-orb-2" cx="1020" cy="310" r="220" fill="url(#glow2)" />
  <circle class="glow-orb-1" cx="950" cy="80" r="140" fill="url(#glow3)" />

  <!-- Architectural Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Background Geometric Flow Lines -->
  <g opacity="0.45" class="dynamic-wave">
    <path class="chart-stream" d="M -50 340 C 250 280, 450 390, 750 320 C 950 270, 1100 350, 1250 310" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="chart-stream" d="M -50 370 C 200 320, 500 420, 800 340 C 1000 300, 1150 370, 1250 330" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Floating Operations Analytics Decorative Elements (Background/Sides) -->
  <g class="floating-card-1" opacity="0.6">
    <rect x="70" y="55" width="130" height="65" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="85" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MRR GROWTH</text>
    <text x="85" y="105" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">+28.4% ↑</text>
  </g>

  <g class="floating-card-2" opacity="0.6">
    <rect x="1000" y="55" width="130" height="65" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="1015" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SUBSCRIPTIONS</text>
    <text x="1015" y="105" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">99.98% Active</text>
  </g>

  <!-- FOREGROUND TEXT CONTENT: Stays Clear, Sharp, High Contrast, and Always Visible -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Category Pill -->
    <rect x="-140" y="65" width="280" height="30" rx="15" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="85" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED FINTECH KNOWLEDGE</text>

    <!-- Main Title -->
    <text x="0" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
      Awesome Billing Operations
    </text>
    <text x="0" y="215" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Admin Consoles
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The definitive directory of enterprise SaaS billing suites &amp; self-hosted open-source admin portals
    </text>

    <!-- Interactive / Status Pills -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="135" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="16" cy="16" r="4.5" fill="#10b981" />
        <text x="28" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">SaaS Engines</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="16" cy="16" r="4.5" fill="#8b5cf6" />
        <text x="28" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Open-Source Hub</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="16" cy="16" r="4.5" fill="#06b6d4" />
        <text x="28" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Market Insights</text>
      </g>
    </g>
  </g>
</svg>
